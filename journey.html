<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey | PTR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="journey-header">
    <a href="index.html" class="logo">PTR.</a>

    <nav class="journey-nav">
        <a href="index.html">HOME</a>
        <a href="journey.html">EXPERIENCE</a>
        <a href="education.html">EDUCATION</a>
        <a href="projects.html">PROJECTS</a>
    </nav>
</header>
    <main class="journey-main">
    <section class="journey-intro">
        <h1>My Journey</h1>
        <p>A connected career across people, data and technology</p>
    </section>

    <!-- Career constellation -->
    <section class="journey-constellation">

        <svg viewBox="0 0 1200 500"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Career constellation connecting HR Operations, HR Technology, People Analytics and Data Science">
        
        <!-- Career constellation connections -->
        <g fill="none"
            stroke="#c6bdd0"
            stroke-width="1.5"
            stroke-opacity="0.65">

        <!-- HR Operations to HR Technology -->
        <path d="M 160 160 Q 300 100 450 310"/>

        <!-- HR Technology to People Analytics -->
        <path d="M 450 310 Q 580 390 750 160"
            stroke-dasharray="2 7"
            stroke-linecap="round"/>

        <!-- People Analytics to Data Science -->
        <path d="M 750 160 Q 900 100 980 235"
            stroke-dasharray="2 7"
            stroke-linecap="round"/>

        <!-- Additional constellation connections -->

        <!-- HR Operations to blue accent node -->
        <path d="M 160 160 Q 220 40 300 65"
            stroke-dasharray="1 7"
            stroke-linecap="round"
            stroke-opacity="0.45"/>

        <!-- HR Technology to purple accent node -->
        <path d="M 450 310 Q 520 230 600 245"
            stroke-dasharray="1 7"
            stroke-linecap="round"
            stroke-opacity="0.45"/>

        <!-- Data Science accent connection -->
        <path d="M 990 245 Q 1100 300 1170 115"
            fill="none"
            stroke="#a39aaa"
            stroke-width="1.5"
            stroke-opacity="0.65"
            stroke-linecap="round"/>

        </g>

        <!-- Small constellation nodes -->

        <circle cx="300" cy="65" r="9" fill="#3265ff"/>

        <circle cx="340" cy="370" r="8" fill="#ff4b32"/>

        <circle cx="600" cy="245" r="11" fill="#853cff"/>

        <circle cx="1170" cy="115" r="9" fill="#5be0c7"/>

        <!-- HR Operations -->
        <circle cx="160" cy="160" r="90"
            class="career-node"
            data-career="operations"
            aria-label="Explore HR Operations"
            role="button"
            tabindex="0"
            fill="#1b1745" fill-opacity="0.65"
            stroke="#3265ff" stroke-width="6"/>

        <!-- HR Technology -->
        <circle cx="450" cy="310" r="90"
            class="career-node"
            data-career="technology"
            role="button"
            tabindex="0"
            aria-label="Explore HR Technology"
            fill="#42102d" fill-opacity="0.65"
            stroke="#ff4b32" stroke-width="6"/>

        <!-- People Analytics -->
        <circle cx="750" cy="160" r="90"
            class="career-node"
            data-career="analytics"
            role="button"
            tabindex="0"
            aria-label="Explore People Analytics"
            fill="#32134e" fill-opacity="0.65"
            stroke="#853cff" stroke-width="6"/>

        <!-- Data Science -->
        <circle cx="1040" cy="310" r="90"
            class="career-node"
            data-career="science"
            role="button"
            tabindex="0"
            aria-label="Explore Data Science"
            fill="#1c2448" fill-opacity="0.65"
            stroke="#5be0c7" stroke-width="6"/>

        <!-- Dotted inner rings -->

        <g fill="none"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-opacity="0.55"
            stroke-dasharray="1 4">

            <!-- HR Operations -->
            <circle cx="160" cy="160" r="81"/>

            <!-- HR Technology -->
            <circle cx="450" cy="310" r="81"/>

            <!-- People Analytics -->
            <circle cx="750" cy="160" r="81"/>

            <!-- Data Science -->
            <circle cx="1040" cy="310" r="81"/>
        </g>

        <!-- Career node labels -->
        <g fill="#ffffff"
            font-family="Helvetica Neue, Arial, sans-serif"
            font-size="25"
            font-weight="400"
            text-anchor="middle">

                <!-- HR Operations -->
                <text x="160" y="153">HR</text>
                <text x="160" y="183">Operations</text>

                <!-- HR Technology -->
                <text x="450" y="303">HR</text>
                <text x="450" y="333">Technology</text>

                <!-- People Analytics -->
                <text x="750" y="153">People</text>
                <text x="750" y="183">Analytics</text>

                <!-- Data Science -->
                <text x="1040" y="303">Data</text>
                <text x="1040" y="333">Science</text>

        </g>
                </svg>

                <!-- Floating career description -->
                <div id="career-popup" class="career-popup" hidden>
                    <h3 id="popup-title"></h3>
                    <p id="popup-description"></p>
                </div>

                </section>
                </main>

        <!-- Career information panel -->
        <section class="journey-details">
            <h2 id="career-title">Where It All Connects</h2>
            <p id="career-description">Four areas of expertise. One connected journey. Select a circle to explore.</p>
        </section> 
    
    <script>
        const careerInfo = {
            operations: {
            title: 'HR Operations',
            description: 'Led global HR operations initiatives spanning workforce planning, talent acquisition, employee engagement, and organizational change. Worked across HR, Finance, and IT to improve processes, strengthen operational efficiency, and support business objectives.',
            color: '#3265ff'
        },
        technology: {
            title: 'HR Technology',
            description: 'Led HR technology transformation initiatives involving SAP SuccessFactors, Greenhouse, and other enterprise platforms. Managed systems integrations, process automation, and data governance initiatives to improve operational efficiency, data accuracy, and access to workforce information.',
            color: '#ff4b32'
        },
        analytics: {
            title: 'People Analytics',
            description: 'Led People Analytics teams and reporting strategies, translating complex workforce data into actionable insights for business leaders. Developed reporting frameworks and dashboards covering attrition, hiring, performance, headcount, and organizational trends to support informed workforce decisions.',
            color: '#853cff'
        },
        science: {
            title: 'Data Science',
            description: 'Expanding my People Analytics expertise through a Master’s in Data Science at the University of Porto. Developing advanced capabilities in statistics, programming, machine learning, and data visualization to bridge the gap between business challenges and analytical solutions.',
            color: '#5be0c7'
        }
    };

        const popup = document.getElementById('career-popup');
        const popupTitle = document.getElementById('popup-title');
        const popupDescription = document.getElementById('popup-description');

        let selectedCareer = null;

        document.querySelectorAll('.career-node').forEach(node => {
        node.addEventListener('click', function () {
            const career = this.dataset.career;

            // Clicking the same circle again closes the description
            if (selectedCareer === career) {
            popup.hidden = true;
            selectedCareer = null;
            return;
            }

            // Display the selected career information
            const info = careerInfo[career];

            popupTitle.textContent = info.title;
            popupTitle.style.color = info.color;
            popupDescription.textContent = info.description;

            popup.classList.toggle('technology', career === 'technology');
            popup.classList.toggle('analytics', career === 'analytics');
            popup.classList.toggle('science', career === 'science');

            popup.hidden = false;
            selectedCareer = career;
        });
    });
    </script>

</body>
</html>
